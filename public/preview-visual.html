<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIZEX | Demo Visual v15</title><style>body{margin:0} /* VIZEX v15 — page-switching digital invitation. Scoped styles avoid admin/editor regressions. */
.v15-shell{--paper:#faf4e8;--ink:#826b52;--edge:#b3996e;--nav:#f3eee4;--btn:#94754b;--btnInk:#fff7e7;--outside:#e7ebe7;position:relative;display:flex;justify-content:center;align-items:center;min-height:100dvh;background:var(--outside);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
.v15-shell *{box-sizing:border-box}.v15-shell button,.v15-shell input,.v15-shell textarea,.v15-shell select{font-family:inherit}.v15-shell button:focus-visible,.v15-shell a:focus-visible{outline:3px solid #9ebed9;outline-offset:3px}
.v15-stage{position:relative;width:min(100%,430px);height:100dvh;max-height:980px;min-height:520px;overflow:hidden;background:var(--paper);box-shadow:0 18px 65px #102e393d;isolation:isolate}.v15-paper{position:absolute;inset:0;background:var(--paper);background-size:cover;background-position:center;z-index:-4}.v15-mist{position:absolute;inset:auto -26% 7% -26%;height:32%;border-radius:100%;filter:blur(70px);background:rgba(255,255,255,.12);opacity:.7;animation:v15mist 16s ease-in-out infinite alternate;z-index:-2;pointer-events:none}
.v15-shell.v15-style-blue{--paper:#0d3457;--ink:#eed8a3;--edge:#cfae70;--nav:#143e68;--btn:#c9a66c;--btnInk:#173555;--outside:#e1e7ed}.v15-shell.v15-style-blue .v15-paper{background-image:url('themes/batik-blue.svg')}.v15-shell.v15-style-cream{--paper:#fcf4e8;--ink:#8a6c67;--edge:#c7a58a;--nav:#f9f1e8;--btn:#a67a7a;--btnInk:white;--outside:#f0e9e5}.v15-shell.v15-style-cream .v15-paper{background-image:url('themes/cream-flowers.svg')}.v15-shell.v15-style-green{--paper:#e6f0e8;--ink:#4d715c;--edge:#8fa48b;--nav:#dfe7d8;--btn:#587c62;--btnInk:white;--outside:#dfe8e9}.v15-shell.v15-style-green .v15-paper{background-image:url('themes/green-landscape.svg')}.v15-shell.v15-style-royal{--paper:#f0e4ce;--ink:#75573b;--edge:#b99b68;--nav:#f2e6d0;--btn:#755b3c;--btnInk:white;--outside:#e7e0d7}.v15-shell.v15-style-royal .v15-paper{background:radial-gradient(ellipse at 50% 65%,#fffaf1,transparent 60%),linear-gradient(160deg,#f8edd9,#e5d1b5)}
.v15-floaters{position:absolute;inset:0;z-index:-1;pointer-events:none}.v15-floaters span{position:absolute;left:15%;top:20%;font-size:14px;color:var(--edge);opacity:.7;animation:v15float 8s ease-in-out infinite}.v15-floaters span:nth-child(2){left:88%;top:58%;font-size:12px;animation-delay:-4s}.v15-floaters span:nth-child(3){left:11%;top:75%;font-size:10px;animation-delay:-2s}
.v15-entry{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:25px 24px 30px;z-index:8;overflow:hidden}.v15-entry-inner{z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;animation:v15appear 1.15s both}.v15-entry h1{font-family:Georgia,'Times New Roman',serif;font-weight:normal;line-height:1.12;font-size:clamp(34px,8vw,51px);margin:4px 0 0;max-width:100%;text-shadow:0 2px 15px #ffffff32}.v15-entry h1 em,.v15-panel-opening h2 em,.v15-panel-gift h3 em{font-weight:normal;font-size:.65em}.v15-entry p{margin:0;font-size:12px;letter-spacing:.06em}.v15-entry small{font-size:10px;opacity:.7}.v15-smallcap,.v15-kicker{font:10px/1.4 Arial,sans-serif;letter-spacing:.29em;font-weight:700;color:var(--ink);text-transform:uppercase}.v15-entry-ring{width:169px;height:198px;border:1px solid var(--edge);border-radius:88px 88px 28px 28px;padding:8px;box-shadow:0 0 0 7px #fff5,0 0 0 8px var(--edge);animation:v15breathe 9s ease-in-out infinite}.v15-entry-symbol{height:100%;width:100%;border-radius:77px 77px 22px 22px;overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.10);font-size:65px}.v15-entry-symbol img{height:100%;width:100%;object-fit:cover}.v15-entry .v15-to{font-size:12px;line-height:1.6}.v15-entry .v15-to strong{font-size:17px;font-weight:normal}.v15-divider{display:flex;align-items:center;justify-content:center;gap:12px;opacity:.76;margin:4px auto 0}.v15-divider::before,.v15-divider::after{content:'';width:40px;height:1px;background:var(--edge)}.v15-main-button,.v15-outline-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid var(--btn);border-radius:50px;padding:10px 19px;background:var(--btn);color:var(--btnInk);font:600 12px/1.3 Arial,sans-serif;text-align:center;letter-spacing:.02em;cursor:pointer;transition:transform .18s,filter .2s}.v15-main-button:hover,.v15-outline-button:hover{transform:translateY(-2px);filter:brightness(1.06)}.v15-outline-button{background:transparent;color:var(--ink);border-color:var(--edge)}.v15-entry .v15-main-button{margin:8px 0 0;box-shadow:0 5px 22px #00000017}.v15-entry-opening .v15-entry-inner{animation:v15exit .87s cubic-bezier(.2,.67,.32,1) forwards}.v15-curtain{position:absolute;top:0;bottom:0;width:50%;pointer-events:none;opacity:0;background:linear-gradient(130deg,var(--paper),var(--nav));z-index:3}.v15-curtain-left{left:0;transform:translateX(-110%)}.v15-curtain-right{right:0;transform:translateX(110%)}.v15-entry-opening .v15-curtain-left{opacity:1;animation:v15curtainL 1.14s ease-in-out both}.v15-entry-opening .v15-curtain-right{opacity:1;animation:v15curtainR 1.14s ease-in-out both}
.v15-page-area{position:absolute;inset:0 0 76px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--edge) transparent;animation:v15page .72s cubic-bezier(.16,1,.3,1) both}.v15-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100%;padding:36px 28px 42px;gap:12px}.v15-panel h2{font:normal clamp(31px,7vw,45px)/1.16 Georgia,serif;margin:6px 0 2px;max-width:100%}.v15-panel h3{font:normal 23px/1.2 Georgia,serif;margin:5px 0}.v15-panel p{font:13px/1.85 Georgia,serif;max-width:310px;margin:0}.v15-muted{font-size:11px!important;opacity:.75}.v15-center-label{font:11px Arial,sans-serif!important;letter-spacing:.06em}.v15-monogram{font-size:19px;letter-spacing:.15em;opacity:.65}.v15-monogram small{font-size:11px}.v15-cover-medallion{width:155px;height:188px;border:2px solid var(--edge);padding:8px;border-radius:94px 94px 42px 42px;box-shadow:0 5px 0 rgba(255,255,255,.25),0 12px 34px #0002;overflow:hidden;display:grid;place-items:center;font-size:70px;margin:5px 0}.v15-cover-medallion img{height:100%;width:100%;object-fit:cover;border-radius:82px 82px 34px 34px}.v15-panel-opening h2{font-size:40px}.v15-countdown{display:flex;gap:8px;justify-content:center;margin:8px 0 10px}.v15-countdown>div{display:grid;gap:3px;min-width:46px;padding:7px 6px;border:1px solid var(--edge);border-radius:5px;background:#fff1}.v15-countdown strong{font-size:22px;font-weight:normal}.v15-countdown span{font:9px Arial,sans-serif;letter-spacing:.05em}.v15-initial-icon{width:92px;height:92px;border:1px solid var(--edge);border-radius:50%;display:grid;place-items:center;font-size:43px;box-shadow:0 0 0 8px #fff2;margin:12px auto}.v15-quote{font-style:italic;font-size:16px!important;line-height:2.05!important}.v15-verse{font:11px Arial,sans-serif;letter-spacing:.08em;opacity:.82}.v15-couple-grid{display:grid;grid-template-columns:1fr 25px 1fr;align-items:center;gap:6px;width:100%;max-width:340px;margin:10px auto}.v15-couple-grid article{min-width:0}.v15-couple-avatar{width:116px;height:143px;border-radius:70px 70px 12px 12px;border:3px double var(--edge);display:grid;place-items:center;margin:0 auto 10px;overflow:hidden;font-size:52px;background:rgba(255,255,255,.16)}.v15-couple-avatar img{width:100%;height:100%;object-fit:cover}.v15-couple-avatar b{font-weight:normal}.v15-couple-grid h3{font-size:20px;overflow-wrap:anywhere}.v15-couple-grid article>span{font:9px Arial,sans-serif;letter-spacing:.13em}.v15-amp{font-size:25px}.v15-story{margin:9px auto!important;font-style:italic}.v15-events{display:grid;gap:10px;width:100%;margin:8px auto}.v15-events article{padding:14px;border:1px solid var(--edge);border-radius:80px 80px 12px 12px;background:#fff1;display:grid;gap:5px}.v15-events h3{margin:1px 0;font-size:24px}.v15-events strong{font:600 12px Arial,sans-serif}.v15-events article>span:not(.v15-event-mark){font-size:12px}.v15-event-mark{font:9px Arial,sans-serif;letter-spacing:.2em}.v15-location-title{font-size:19px!important}.v15-spacing{height:15px}.v15-photo-grid{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px auto}.v15-photo-grid button,.v15-photo-blank{width:100%;height:135px;border:1px solid var(--edge);border-radius:80px 80px 8px 8px;overflow:hidden;background:#fff3;padding:0}.v15-photo-grid button:nth-child(3n),.v15-photo-blank:nth-child(3n){height:110px;border-radius:8px}.v15-photo-grid img{width:100%;height:100%;object-fit:cover}.v15-photo-blank{display:grid;place-content:center;gap:6px}.v15-photo-blank span{font-size:26px}.v15-photo-blank small{font:9px Arial,sans-serif;letter-spacing:.15em}.v15-rsvp-form{display:grid;gap:11px;width:100%;max-width:340px;text-align:left;margin:9px auto;padding:13px;border:1px solid var(--edge);background:#fff3;border-radius:15px}.v15-rsvp-form label{font:11px/1.5 Arial,sans-serif;display:grid;gap:5px}.v15-rsvp-form input,.v15-rsvp-form textarea,.v15-rsvp-form select{width:100%;min-height:39px;border:1px solid #b9afa1;border-radius:8px;background:#ffffffe3;color:#252b29;padding:9px;font:13px Arial,sans-serif}.v15-rsvp-form .v15-main-button{margin-top:4px}.v15-feedback{font-size:11px!important}.v15-bank-card{border:1px solid var(--edge);border-radius:12px;max-width:300px;padding:22px 20px;display:grid;gap:13px;background:#fff2;margin:12px auto}.v15-bank-card small{font:10px Arial,sans-serif;letter-spacing:.16em}.v15-bank-card strong{font-size:19px;font-weight:normal}.v15-bank-card p{font-size:18px;letter-spacing:.04em}.v15-panel-gift h3{font-size:29px}
.v15-side-actions{position:absolute;right:10px;bottom:100px;display:grid;gap:9px;z-index:5}.v15-side-actions button,.v15-side-actions a{width:38px;height:38px;display:grid;place-items:center;text-decoration:none;border:1px solid var(--edge);border-radius:50%;font-size:20px;color:var(--ink);background:var(--nav);box-shadow:0 4px 14px #0002;transition:transform .2s}.v15-side-actions button:hover,.v15-side-actions a:hover{transform:scale(1.1)}.v15-bottom-nav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:2px;padding:7px 4px max(8px,env(safe-area-inset-bottom));height:76px;background:var(--nav);box-shadow:0 -5px 25px #00000010;z-index:6}.v15-bottom-nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--ink);border:0;background:transparent;border-radius:10px;padding:4px 0;font:11px Arial,sans-serif;opacity:.8}.v15-bottom-nav button span{font:22px/1 Georgia,serif}.v15-bottom-nav button small{font:8.5px Arial,sans-serif;white-space:nowrap}.v15-bottom-nav button.active{background:var(--btn);color:var(--btnInk);opacity:1;box-shadow:0 3px 13px #00000012}.v15-lightbox{position:fixed;inset:0;background:#101914e9;z-index:120;display:grid;place-items:center;padding:25px}.v15-lightbox img{max-width:100%;max-height:88dvh;object-fit:contain}.v15-lightbox button{position:absolute;top:25px;right:25px;color:white;background:#4448;border:1px solid #fffa;border-radius:50%;width:45px;height:45px}.v15-reset{position:absolute;left:11px;bottom:90px;z-index:12;border:1px solid var(--edge);border-radius:50%;background:var(--nav);color:var(--ink);width:36px;height:36px;font-size:19px}
.demo-toolbar+.v15-shell{padding-top:40px;min-height:100dvh}.demo-toolbar+.v15-shell .v15-stage{height:calc(100dvh - 40px)}
@media(max-width:480px){.v15-shell{background:var(--paper)}.v15-stage{width:100%;max-height:none;min-height:0;box-shadow:none}.v15-entry{padding:20px}.v15-entry-ring{height:176px;width:151px}.v15-entry h1{font-size:clamp(32px,8.9vw,45px)}.v15-entry-inner{gap:11px}.v15-panel{padding:26px 28px 35px}.v15-side-actions{right:7px}.v15-side-actions button,.v15-side-actions a{width:34px;height:34px}.v15-bottom-nav{padding-left:2px;padding-right:2px}.v15-bottom-nav button small{font-size:8px}}
@media(max-height:650px){.v15-entry-inner{gap:7px}.v15-entry-ring{width:119px;height:135px}.v15-entry h1{font-size:31px}.v15-entry .v15-to{font-size:11px}.v15-entry .v15-main-button{margin-top:2px}.v15-page-area{inset-bottom:74px}.v15-panel{justify-content:flex-start;padding-top:40px}.v15-panel-opening{justify-content:center}.v15-cover-medallion{width:112px;height:133px}.v15-panel-opening h2{font-size:31px}.v15-countdown strong{font-size:16px}}
@media(prefers-reduced-motion:reduce){.v15-shell *, .v15-shell *::before,.v15-shell *::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@keyframes v15appear{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}@keyframes v15exit{to{opacity:0;transform:scale(.9);filter:blur(13px)}}@keyframes v15curtainL{0%{opacity:0;transform:translateX(-110%)}35%{opacity:.94;transform:translateX(0)}60%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(-110%)}}@keyframes v15curtainR{0%{opacity:0;transform:translateX(110%)}35%{opacity:.94;transform:translateX(0)}60%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(110%)}}@keyframes v15page{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}@keyframes v15mist{to{transform:translate(30px,-16px)}}@keyframes v15float{50%{transform:translateY(-15px) rotate(12deg)}}@keyframes v15breathe{50%{transform:translateY(-6px);box-shadow:0 0 0 7px #fff5,0 0 0 8px var(--edge),0 12px 25px #0003}}
</style></head><body><div id="root"></div><script>
const params=new URLSearchParams(location.search);const theme=['blue','cream','green'].includes(params.get('theme'))?params.get('theme'):'blue';const root=document.getElementById('root');const data={blue:{name:'Biru Keraton',t1:'Raka',t2:'Naira',color:'blue'},cream:{name:'Cream Peony',t1:'Adrian',t2:'Mawar',color:'cream'},green:{name:'Green Horizon',t1:'Arman',t2:'Nura',color:'green'}}[theme];
function template(){root.innerHTML=`<main class="v15-shell v15-style-${theme}"><div class="v15-stage"><div class="v15-paper"></div><div class="v15-mist"></div><div class="v15-floaters"><span>✦</span><span>✧</span><span>✦</span></div><div class="v15-entry" id="cover"><div class="v15-entry-inner"><div class="v15-smallcap">THE WEDDING OF</div><div class="v15-entry-ring"><div class="v15-entry-symbol">❦</div></div><h1>${data.t1} <em>&</em> ${data.t2}</h1><p>Minggu · 20 Juni 2027</p><div class="v15-divider">✦</div><p class="v15-to">Kepada Yth.<br/><strong>Tamu Undangan</strong></p><button class="v15-main-button" id="open">✉ Buka Undangan</button><small>Undangan terbaik untuk momen istimewa</small></div><div class="v15-curtain v15-curtain-left"></div><div class="v15-curtain v15-curtain-right"></div></div></div></main>`;document.querySelector('#open').onclick=()=>{document.querySelector('#cover').classList.add('v15-entry-opening');setTimeout(()=>show('opening'),1100)};}
function show(tab){const stage=document.querySelector('.v15-stage');if(!stage)return;const old=stage.querySelector('#cover');if(old)old.remove();stage.querySelector('.v15-page-area')?.remove();stage.querySelector('.v15-bottom-nav')?.remove();stage.querySelector('.v15-side-actions')?.remove();const content={opening:`<span class="v15-kicker">SAVE THE DATE</span><div class="v15-monogram">${data.t1[0]} <small>&</small> ${data.t2[0]}</div><div class="v15-cover-medallion">❦</div><h2>${data.t1} <em>&</em> ${data.t2}</h2><p class="v15-center-label">Minggu, 20 Juni 2027</p><div class="v15-countdown"><div><strong>25</strong><span>Hari</span></div><div><strong>12</strong><span>Jam</span></div><div><strong>06</strong><span>Menit</span></div><div><strong>30</strong><span>Detik</span></div></div><button class="v15-outline-button" data-jump="quotes">Selanjutnya →</button>`,quotes:`<span class="v15-kicker">DOA & HARAPAN</span><div class="v15-initial-icon">❧</div><h2>Dengan Rahmat<br/>dan Kasih Sayang</h2><p class="v15-quote">“Dan di antara tanda-tanda kekuasaan-Nya ialah Dia menciptakan untukmu pasangan-pasangan dari jenismu sendiri, supaya kamu merasa tenteram kepadanya.”</p><span class="v15-verse">QS. Ar-Rum: 21</span><div class="v15-divider">✦</div><p>Dua hati, satu kisah, selamanya.</p>`,couple:`<span class="v15-kicker">THE HAPPY COUPLE</span><h2>Dua Hati,<br/>Satu Perjalanan</h2><div class="v15-couple-grid"><article><div class="v15-couple-avatar"><b>${data.t1[0]}</b></div><h3>${data.t1}</h3><span>MEMPELAI</span></article><span class="v15-amp">&</span><article><div class="v15-couple-avatar"><b>${data.t2[0]}</b></div><h3>${data.t2}</h3><span>MEMPELAI</span></article></div><p class="v15-story">Setiap perjalanan indah dimulai dengan satu pertemuan.</p>`,event:`<span class="v15-kicker">WEDDING EVENT</span><h2>Hari Bahagia Kami</h2><p>Dengan penuh rasa syukur, kami mengundang Anda untuk hadir.</p><div class="v15-events"><article><span class="v15-event-mark">01</span><h3>Akad Nikah</h3><strong>Minggu, 20 Juni 2027</strong><span>09:00 WIB</span></article><article><span class="v15-event-mark">02</span><h3>Resepsi</h3><strong>Minggu, 20 Juni 2027</strong><span>11:00 WIB</span></article></div><h3 class="v15-location-title">The Grand Ballroom</h3><p>Jakarta, Indonesia</p>`,gallery:`<span class="v15-kicker">OUR MEMORIES</span><h2>Galeri Cerita</h2><p>Momen-momen kecil yang menjadi bagian dari perjalanan kami.</p><div class="v15-photo-grid"><div class="v15-photo-blank"><span>❦</span><small>FOTO 1</small></div><div class="v15-photo-blank"><span>❦</span><small>FOTO 2</small></div><div class="v15-photo-blank"><span>❦</span><small>FOTO 3</small></div><div class="v15-photo-blank"><span>❦</span><small>FOTO 4</small></div></div>`,rsvp:`<span class="v15-kicker">RSVP & WISHES</span><h2>Konfirmasi Kehadiran</h2><p>Mohon berkenan memberi kabar untuk memudahkan persiapan acara kami.</p><form class="v15-rsvp-form"><label>Nama lengkap<input placeholder="Nama Anda"/></label><label>Konfirmasi<select><option>InsyaAllah hadir</option><option>Maaf, tidak bisa hadir</option><option>Belum pasti</option></select></label><label>Jumlah tamu<select><option>1 orang</option><option>2 orang</option></select></label><label>Ucapan & doa<textarea rows="3"></textarea></label><button type="button" class="v15-main-button">Kirim Konfirmasi</button></form>`,gift:`<span class="v15-kicker">WEDDING GIFT</span><div class="v15-initial-icon">♡</div><h2>Tanda Kasih</h2><p>Doa restu Anda merupakan hadiah terindah bagi kami.</p><p class="v15-muted">Informasi amplop digital bisa ditambahkan melalui editor.</p><div class="v15-divider">✦</div><p>Terima kasih atas doa dan kehadiran Anda.</p><h3>${data.t1} <em>&</em> ${data.t2}</h3>`};stage.insertAdjacentHTML('beforeend',`<div class="v15-page-area"><section class="v15-panel v15-panel-${tab}">${content[tab]}</section></div><div class="v15-side-actions"><button title="Musik">♫</button></div><nav class="v15-bottom-nav">${[['opening','✉','Opening'],['quotes','✧','Doa'],['couple','♥','Mempelai'],['event','◷','Acara'],['gallery','▧','Galeri'],['rsvp','✓','RSVP'],['gift','♡','Hadiah']].map(([id,ic,txt])=>`<button data-id="${id}" class="${tab===id?'active':''}"><span>${ic}</span><small>${txt}</small></button>`).join('')}</nav>`);stage.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(b.dataset.id));stage.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>show(b.dataset.jump));}
template();</script></body></html>
